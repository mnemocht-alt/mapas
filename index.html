const h2=v=>'#'+v.map(x=>(+x).toString(16).padStart(2,'0')).join('');
function setRT(n){const rt=n.rt&&n.rt.map(r=>r.t).join('')==n.t?n.rt:[{t:n.t||''}];
$('et').innerHTML=rt.map(r=>{let st='';if(r.b)st+='font-weight:700;';if(r.i)st+='font-style:italic;';if(r.c)st+='color:'+NC(r.c)+';';return `<span style="${st}">${esc(r.t).replace(/\n/g,'<br>')}</span>`}).join('')}
function getRT(){const root=$('et'),base=getComputedStyle(root).color,R=[],P0={};
const push=(t,st)=>{if(!t)return;const l=R[R.length-1];if(l&&!!l.b==!!st.b&&!!l.i==!!st.i&&l.c==st.c)l.t+=t;else{const r={t};if(st.b)r.b=1;if(st.i)r.i=1;if(st.c)r.c=st.c;R.push(r)}};
const tail=()=>R.length?R[R.length-1].t.slice(-1):'';
const walk=nd=>{if(nd.nodeType==3){const cs=getComputedStyle(nd.parentElement);push(nd.nodeValue.replace(/\u00a0/g,' '),{b:+cs.fontWeight>=600,i:cs.fontStyle=='italic',c:cs.color==base?undefined:h2(cs.color.match(/\d+/g).slice(0,3))});return}
if(nd.nodeType!=1)return;if(nd.tagName=='BR'){push('\n',P0);return}
if(/^(DIV|P)$/.test(nd.tagName)&&R.length&&tail()!='\n')push('\n',P0);
nd.childNodes.forEach(walk)};
root.childNodes.forEach(walk);
while(R.length&&/^\s*$/.test(R[0].t)&&R.length>1||R.length&&!R[0].t.trim()&&R.length==1)R.shift();
if(R.length){R[0].t=R[0].t.replace(/^\s+/,'');R[R.length-1].t=R[R.length-1].t.replace(/\s+$/,'')}
